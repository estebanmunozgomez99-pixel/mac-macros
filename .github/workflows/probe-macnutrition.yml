# One-time probe: saves McMaster's menu page (and the pages it links to) into data/probe/
# so the nightly updater can be written against the real page. Safe to delete afterwards.
name: Probe macnutrition
on:
  push:
    paths: [".github/workflows/probe-macnutrition.yml", "scripts/fetch_macnutrition.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch station reports
        run: |
          python3 scripts/fetch_macnutrition.py --raw /tmp/reports
          du -sh /tmp/reports; ls -la /tmp/reports | head -60
          mkdir -p data/probe && tar -czf data/probe/reports.tgz -C /tmp reports && ls -la data/probe
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "Probe: save macnutrition pages" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
