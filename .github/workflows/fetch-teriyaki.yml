# One-time: on each Teriyaki Experience meal page, save the page code and the nutrition shown for every "Change protein" option.
name: Fetch Teriyaki proteins
on:
  push:
    paths: [".github/workflows/fetch-teriyaki.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl
        timeout-minutes: 10
        run: |
          mkdir -p data/probe-te /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i -s playwright@1.47.2 >/dev/null
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-te/';
          setTimeout(() => { console.log('watchdog'); process.exit(0); }, 480000);
          const MEALS = ['classic-chicken-teriyaki','classic-beef-teriyaki','bentobox','pineapple-chicken','hot-spicy-chicken','ginger-seseme-beef','protein-bowl','pan-asian-shrimp'];
          (async () => {
            const b = await chromium.launch({ channel: 'chrome' });
            const ctx = await b.newContext({ locale: 'en-CA', viewport: { width: 1300, height: 900 }, userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            await ctx.route(/google|facebook|doubleclick|hotjar|tiktok|pinterest|clarity|youtube/i, r => r.abort());
            const p = await ctx.newPage(); p.setDefaultTimeout(15000);
            const results = {};
            for (const slug of MEALS) {
              const u = `https://teriyakiexperience.com/menu/${slug}/`;
              await p.goto(u, { waitUntil: 'domcontentloaded', timeout: 25000 }).catch(() => null);
              await p.waitForTimeout(2500);
              if (slug === MEALS[0]) fs.writeFileSync(out + 'product.html', await p.content());
              // Everything clickable after the "CHANGE PROTEIN" heading
              const opts = await p.evaluate(() => {
                const all = [...document.querySelectorAll('body *')];
                const h = all.find(e => /change protein/i.test(e.textContent) && e.children.length === 0);
                if (!h) return [];
                let box = h.parentElement; for (let i = 0; i < 4 && box && box.querySelectorAll('a,button,[role=button],label,input,li').length < 2; i++) box = box.parentElement;
                return box ? [...box.querySelectorAll('a,button,[role=button],label,li,input')].map((e, i) => ({ i, tag: e.tagName, text: (e.innerText || e.value || e.getAttribute('aria-label') || e.getAttribute('title') || e.getAttribute('alt') || '').trim(), href: e.href || '', cls: e.className + '' })) : [];
              });
              results[slug] = { opts, shots: {} };
              const text = () => p.evaluate(() => document.body.innerText);
              results[slug].shots['default'] = await text();
              for (const o of opts) {
                if (o.href && /teriyakiexperience\.com\/menu\//.test(o.href) && !o.href.includes(slug)) {
                  await p.goto(o.href, { waitUntil: 'domcontentloaded', timeout: 25000 }).catch(() => null); await p.waitForTimeout(2000);
                  results[slug].shots[o.text + ' @' + o.href] = await text();
                  await p.goto(u, { waitUntil: 'domcontentloaded', timeout: 25000 }).catch(() => null); await p.waitForTimeout(1500);
                } else {
                  const el = (await p.$$('a,button,[role=button],label,li,input')).find(async () => false);
                  await p.evaluate(({ t }) => { const e = [...document.querySelectorAll('a,button,[role=button],label,li,input')].find(x => (x.innerText || x.value || '').trim() === t); if (e) e.click(); }, { t: o.text }).catch(() => {});
                  await p.waitForTimeout(1500);
                  results[slug].shots[o.text] = await text();
                }
              }
              console.log(slug, opts.map(o => o.text + (o.href ? ' -> ' + o.href : '')).join(' | '));
            }
            fs.writeFileSync(out + 'proteins.json', JSON.stringify(results, null, 1));
            await b.close(); process.exit(0);
          })();
          JS
          node get.js > "$GITHUB_WORKSPACE/data/probe-te/run.log" 2>&1 || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-te && git commit -m "Fetch: Teriyaki proteins" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
