# One-time: crawl teriyakiexperience.com/menu/ in a real browser and save every menu page's text into data/probe-te/.
name: Fetch Teriyaki Experience
on:
  push:
    paths: [".github/workflows/fetch-teriyaki.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl
        run: |
          mkdir -p data/probe-te /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && npm i -s playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-te/';
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ locale: 'en-CA', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            const p = await ctx.newPage();
            const api = [];
            p.on('response', r => { const ct = r.headers()['content-type'] || ''; if (/json|pdf/.test(ct)) api.push(r.status() + ' ' + ct.split(';')[0] + ' ' + r.url()); });
            const queue = ['https://teriyakiexperience.com/menu/classic-chicken-teriyaki/', 'https://teriyakiexperience.com/menu/', 'https://teriyakiexperience.com/nutrition/'];
            const seen = new Set(); let n = 0; const index = [];
            while (queue.length && n < 120) {
              const u = queue.shift().split('#')[0]; if (seen.has(u)) continue; seen.add(u);
              const r = await p.goto(u, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => null);
              n++; await p.waitForTimeout(1200);
              const text = await p.evaluate(() => document.body ? document.body.innerText : '').catch(() => '');
              fs.writeFileSync(out + 'page' + n + '.txt', u + ' ' + (r ? r.status() : 0) + '\n\n' + text);
              index.push(n + ' ' + u);
              const links = await p.$$eval('a', as => as.map(a => a.href)).catch(() => []);
              for (const h of links) { const k = h.split('#')[0].split('?')[0];
                if (/teriyakiexperience\.com\/(menu|nutrition|[a-z-]*nutrition[a-z-]*)\//i.test(k) && !seen.has(k) && !queue.includes(k)) queue.push(k);
                if (/\.pdf$/i.test(k) && !seen.has(k)) { seen.add(k); const res = await ctx.request.get(k).catch(() => null);
                  if (res && res.ok()) { fs.writeFileSync(out + 'doc' + n + '.pdf', await res.body()); index.push('PDF doc' + n + ' ' + k); } } }
            }
            fs.writeFileSync(out + 'index.txt', index.join('\n'));
            fs.writeFileSync(out + 'api.txt', api.join('\n'));
            await b.close();
          })();
          JS
          node get.js > "$GITHUB_WORKSPACE/data/probe-te/run.log" 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-te && git commit -m "Fetch: Teriyaki Experience" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
