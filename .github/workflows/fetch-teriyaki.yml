# One-time (try 5, full crawl): crawl teriyakiexperience.com/menu/ in a real browser and save every menu page's text into data/probe-te/.
name: Fetch Teriyaki Experience
on:
  push:
    paths: [".github/workflows/fetch-teriyaki.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl
        timeout-minutes: 8
        run: |
          mkdir -p data/probe-te /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && npm i -s playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-te/';
          setTimeout(() => { fs.writeFileSync(out + 'index.txt', index.join('\n')); console.log('watchdog: stopped at', n); process.exit(0); }, 400000);
          const index = []; let n = 0;
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ locale: 'en-CA', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            await ctx.route(/google|facebook|doubleclick|hotjar|tiktok|pinterest|clarity|analytics|youtube|instagram/i, r => r.abort());
            const p = await ctx.newPage();
            p.setDefaultTimeout(20000);
            const SKIP = /franchis|location|about|contact|privacy|order|feedback|careers|news|\/fr\/|wp-|feed|#|mailto|tel:|\.(jpg|png|pdf)$/i;
            const queue = ['https://teriyakiexperience.com/menu/', 'https://teriyakiexperience.com/menu/classic-chicken-teriyaki/'], seen = new Set();
            while (queue.length && n < 90) {
              const u = queue.shift(); if (seen.has(u)) continue; seen.add(u);
              const r = await p.goto(u, { waitUntil: 'domcontentloaded', timeout: 20000 }).catch(() => null);
              await p.waitForTimeout(1500); n++;
              const text = await p.evaluate(() => document.body ? document.body.innerText : '').catch(() => '');
              fs.writeFileSync(out + 'page' + n + '.txt', u + ' ' + (r ? r.status() : 0) + '\n\n' + text);
              index.push(n + ' ' + u);
              const links = await p.$$eval('a', as => as.map(a => a.href)).catch(() => []);
              for (const h of links) { const k = h.split('#')[0].split('?')[0];
                if (/^https:\/\/(www\.)?teriyakiexperience\.com\/[^?]+/.test(k) && !SKIP.test(k) && !seen.has(k) && !queue.includes(k)) queue.push(k); }
            }
            fs.writeFileSync(out + 'index.txt', index.join('\n'));
            console.log('done', n);
            await b.close(); process.exit(0);
          })();
          JS
          node get.js > "$GITHUB_WORKSPACE/data/probe-te/run.log" 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-te && git commit -m "Fetch: Teriyaki Experience" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
