# One-time (try 3): crawl teriyakiexperience.com/menu/ in a real browser and save every menu page's text into data/probe-te/.
name: Fetch Teriyaki Experience
on:
  push:
    paths: [".github/workflows/fetch-teriyaki.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl
        run: |
          mkdir -p data/probe-te /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && npm i -s playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-te/';
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ locale: 'en-CA', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            const p = await ctx.newPage();
            for (const [name, u] of [['product', 'https://teriyakiexperience.com/menu/classic-chicken-teriyaki/'], ['menu', 'https://teriyakiexperience.com/menu/']]) {
              await p.goto(u, { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => null);
              await p.waitForTimeout(3000);
              fs.writeFileSync(out + name + '.html', await p.content());
              const links = await p.$$eval('a', as => as.map(a => a.href + ' | ' + a.innerText.trim().replace(/\s+/g, ' ').slice(0, 60)));
              fs.writeFileSync(out + name + '-links.txt', [...new Set(links)].join('\n'));
            }
            await b.close();
          })();
          JS
          node get.js > "$GITHUB_WORKSPACE/data/probe-te/run.log" 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-te && git commit -m "Fetch: Teriyaki Experience" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
