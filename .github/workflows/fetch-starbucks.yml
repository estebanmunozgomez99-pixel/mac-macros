# One-time (run 4): open starbucks.ca/menu in a real browser and save the menu data it loads into data/probe-sb/.
name: Fetch Starbucks menu
on:
  push:
    paths: [".github/workflows/fetch-starbucks.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch with a real browser
        run: |
          mkdir -p data/probe-sb /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && npm i -s playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-sb/';
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ locale: 'en-CA', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            const p = await ctx.newPage();
            await p.goto('https://www.starbucks.ca/menu', { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log('goto', e.message));
            const mr = await ctx.request.get('https://www.starbucks.ca/apiproxy/v1/ordering/menu');
            console.log('menu status', mr.status());
            const menu = JSON.parse(await mr.text());
            fs.writeFileSync(out + 'menu.json', JSON.stringify(menu));
            // Learn the product endpoint from a real product page
            const api = [];
            p.on('response', r => { if (/apiproxy/.test(r.url())) api.push(r.status() + ' ' + r.url()); });
            await p.goto('https://www.starbucks.ca/menu/product/2123/hot', { waitUntil: 'networkidle', timeout: 90000 }).catch(() => {});
            await p.waitForTimeout(4000);
            fs.writeFileSync(out + 'product-network.txt', api.join('\n'));
            fs.writeFileSync(out + 'product.txt', await p.evaluate(() => document.body.innerText));
            // Every product (skip At Home), via the endpoint pattern the product page used
            const prods = [];
            (function walk(ms, path) { for (const m of ms) { const pth = path + '/' + m.name;
              if (!pth.startsWith('/At Home')) for (const x of m.products) prods.push({ path: pth, n: x.productNumber, f: x.formCode, name: x.name });
              walk(m.children || [], pth); } })(menu.menus, '');
            const seen = new Set(), all = {};
            const tmpl = (api.find(u => /ordering\/2123\/hot/i.test(u)) || ' https://www.starbucks.ca/apiproxy/v1/ordering/2123/hot').split(' ')[1];
            console.log('template', tmpl, 'products', prods.length);
            for (const x of prods) {
              const k = x.n + '/' + x.f; if (seen.has(k)) continue; seen.add(k);
              const u = tmpl.replace(/2123\/hot/i, encodeURIComponent(x.n) + '/' + encodeURIComponent(x.f.toLowerCase()));
              try { const r = await ctx.request.get(u); all[k] = { path: x.path, status: r.status(), body: r.ok() ? await r.json() : null }; }
              catch (e) { all[k] = { path: x.path, error: e.message }; }
              await p.waitForTimeout(400);
            }
            fs.writeFileSync(out + 'products.json', JSON.stringify(all));
            console.log('fetched', Object.keys(all).length, 'ok', Object.values(all).filter(v => v.body).length);
            await b.close();
          })();
          JS
          node get.js > "$GITHUB_WORKSPACE/data/probe-sb/run.log" 2>&1 || echo "node failed: $?" >> "$GITHUB_WORKSPACE/data/probe-sb/run.log"
          cd "$GITHUB_WORKSPACE/data/probe-sb" && gzip -9 -f products.json menu.json || true; ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-sb && git commit -m "Fetch: Starbucks menu" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
