# One-time: open starbucks.ca/menu in a real browser and save the menu data it loads into data/probe-sb/.
name: Fetch Starbucks menu
on:
  push:
    paths: [".github/workflows/fetch-starbucks.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch with a real browser
        run: |
          mkdir -p data/probe-sb /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && npm i -s playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-sb/';
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ locale: 'en-CA', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            const p = await ctx.newPage();
            const log = []; let n = 0;
            p.on('response', async r => {
              const u = r.url(), ct = r.headers()['content-type'] || '';
              log.push(r.status() + ' ' + ct.split(';')[0] + ' ' + u);
              if (ct.includes('json') && n < 40) { try { fs.writeFileSync(out + 'json' + (++n) + '.json', JSON.stringify({ url: u, body: await r.json() })); } catch (e) {} }
            });
            const r = await p.goto('https://www.starbucks.ca/menu', { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log('goto', e.message));
            console.log('status', r && r.status());
            await p.waitForTimeout(6000);
            fs.writeFileSync(out + 'menu.txt', await p.evaluate(() => document.body.innerText));
            const links = await p.$$eval('a', as => [...new Set(as.map(a => a.href))]);
            fs.writeFileSync(out + 'links.txt', links.join('\n'));
            // Open one product page to see where its nutrition comes from
            const prod = links.find(l => /\/menu\/product\//.test(l));
            if (prod) { await p.goto(prod, { waitUntil: 'networkidle', timeout: 90000 }).catch(() => {}); await p.waitForTimeout(5000);
              fs.writeFileSync(out + 'product.txt', prod + '\n\n' + await p.evaluate(() => document.body.innerText)); }
            fs.writeFileSync(out + 'network.txt', log.join('\n'));
            await b.close();
          })();
          JS
          node get.js
          ls -la "$GITHUB_WORKSPACE/data/probe-sb"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-sb && git commit -m "Fetch: Starbucks menu" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
