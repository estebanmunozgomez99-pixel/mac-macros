# One-time: find McMaster Hospitality's hours of operation pages and save their text into data/probe-hours/.
name: Probe hours
on:
  push:
    paths: [".github/workflows/probe-hours.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save the LibCal hours feed
        run: |
          mkdir -p data/probe-hours && cd data/probe-hours
          UA="Mozilla/5.0 (Maroon campus macro app; contact esteban.munoz.gomez99@gmail.com)"
          curl -sSL -A "$UA" -o grid.json "https://hospitality-mcmaster.libcal.com/widget/hours/grid?iid=4258&format=json&weeks=2&systemTime=0" || true
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-hours && git commit -m "Probe: hours pages" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
