# One-time: find McMaster Hospitality's hours of operation pages and save their text into data/probe-hours/.
name: Probe hours
on:
  push:
    paths: [".github/workflows/probe-hours.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save the open-now page
        run: |
          mkdir -p data/probe-hours && cd data/probe-hours
          UA="Mozilla/5.0 (Maroon campus macro app; contact esteban.munoz.gomez99@gmail.com)"
          curl -sSL -A "$UA" -D h1.txt -o open-now.html "https://hospitality.mcmaster.ca/maceats/open-now/" || true
          ls -la; grep -o 'href="[^"]*"' open-now.html | grep -i -E "week|next|prev|ajax|date" | head -20 > nav-links.txt || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-hours && git commit -m "Probe: hours pages" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
