# One-time (try 2, uses the runner's Chrome): crawl choppedleaf.ca (menu + nutrition) in a real browser; save page text and any nutrition/allergen PDFs to data/probe-cl/.
name: Fetch Chopped Leaf
on:
  push:
    paths: [".github/workflows/fetch-choppedleaf.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl
        timeout-minutes: 10
        run: |
          mkdir -p data/probe-cl /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i -s playwright@1.47.2 >/dev/null && which google-chrome
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-cl/';
          const index = []; let n = 0, d = 0;
          setTimeout(() => { fs.writeFileSync(out + 'index.txt', index.join('\n')); console.log('watchdog', n); process.exit(0); }, 420000);
          (async () => {
            const b = await chromium.launch({ channel: 'chrome' });
            const ctx = await b.newContext({ locale: 'en-CA', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            await ctx.route(/google|facebook|doubleclick|hotjar|tiktok|pinterest|clarity|youtube/i, r => r.abort());
            const p = await ctx.newPage(); p.setDefaultTimeout(20000);
            const queue = ['https://choppedleaf.ca/menu/', 'https://choppedleaf.ca/nutrition/', 'https://choppedleaf.ca/'], seen = new Set();
            const SKIP = /franchis|career|contact|privacy|terms|gift|news|blog|login|account|cart|order|\/fr\//i;
            while (queue.length && n < 60) {
              const u = queue.shift(); if (seen.has(u)) continue; seen.add(u);
              const r = await p.goto(u, { waitUntil: 'domcontentloaded', timeout: 20000 }).catch(() => null);
              await p.waitForTimeout(2000); n++;
              const text = await p.evaluate(() => document.body ? document.body.innerText : '').catch(() => '');
              fs.writeFileSync(out + 'page' + n + '.txt', u + ' ' + (r ? r.status() : 0) + '\n\n' + text);
              index.push(n + ' ' + u);
              const links = await p.$$eval('a', as => as.map(a => a.href + ' | ' + a.innerText.trim().replace(/\s+/g, ' ').slice(0, 60))).catch(() => []);
              fs.appendFileSync(out + 'links.txt', '== ' + u + '\n' + links.join('\n') + '\n');
              for (const l of links) { const h = l.split(' | ')[0].split('#')[0];
                if (/\.pdf(\?|$)/i.test(h) && !seen.has(h)) { seen.add(h);
                  const res = await ctx.request.get(h).catch(() => null);
                  if (res && res.ok()) { d++; fs.writeFileSync(out + 'doc' + d + '.pdf', await res.body()); index.push('PDF doc' + d + ' ' + h + ' | ' + l.split(' | ')[1]); } continue; }
                if (/^https:\/\/(www\.)?choppedleaf\.ca\//.test(h) && !SKIP.test(h) && !seen.has(h) && !queue.includes(h)) queue.push(h); }
            }
            fs.writeFileSync(out + 'index.txt', index.join('\n')); console.log('done', n, d);
            await b.close(); process.exit(0);
          })();
          JS
          node get.js > "$GITHUB_WORKSPACE/data/probe-cl/run.log" 2>&1 || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-cl && git commit -m "Fetch: Chopped Leaf" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
