# One-time: download Pizza Pizza's nutrition page and the documents it links to into data/probe-pp/.
name: Fetch Pizza Pizza nutrition
on:
  push:
    paths: [".github/workflows/fetch-pizzapizza.yml"]  # try 3
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch with a real browser
        run: |
          mkdir -p data/probe-pp /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && npm i -s playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-pp/';
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ locale: 'en-CA', viewport: { width: 1400, height: 1000 }, userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            const p = await ctx.newPage();
            const r = await p.goto('https://www.pizzapizza.ca/about-us/nutrition/small-pizza/', { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log('goto', e.message));
            console.log('status', r && r.status());
            await p.waitForTimeout(4000);
            fs.writeFileSync(out + 'pizza.html', await p.content());
            fs.writeFileSync(out + 'pizza.txt', await p.evaluate(() => document.body.innerText));
            await p.screenshot({ path: out + 'pizza.png', fullPage: true });
            // Every <select> and its options, then each option's resulting text (sizes, crusts...)
            const sels = await p.$$eval('select', ss => ss.map((s, i) => ({ i, id: s.id, name: s.name, opts: [...s.options].map(o => [o.value, o.text]) })));
            fs.writeFileSync(out + 'selects.json', JSON.stringify(sels, null, 1));
            const links = await p.$$eval('a', as => as.map(a => a.href + ' | ' + a.innerText.trim()).filter(x => /nutrition/.test(x)));
            fs.writeFileSync(out + 'pizza-links.txt', [...new Set(links)].join('\n'));
            for (const s of sels) for (const [v, t] of s.opts) {
              try {
                await p.selectOption(`select >> nth=${s.i}`, v); await p.waitForTimeout(2500);
                const safe = (s.i + '-' + t).replace(/[^a-z0-9]+/gi, '_').slice(0, 60);
                fs.writeFileSync(out + 'sel_' + safe + '.txt', await p.evaluate(() => document.body.innerText));
              } catch (e) { console.log('select fail', s.i, v, e.message); }
            }
            await b.close();
          })();
          JS
          node get.js
          ls -la "$GITHUB_WORKSPACE/data/probe-pp"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-pp && git commit -m "Fetch: Pizza Pizza nutrition" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
