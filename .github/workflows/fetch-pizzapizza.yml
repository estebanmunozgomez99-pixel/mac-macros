# One-time: download Pizza Pizza's nutrition page and the documents it links to into data/probe-pp/.
name: Fetch Pizza Pizza nutrition
on:
  push:
    paths: [".github/workflows/fetch-pizzapizza.yml"]  # try 4
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch with a real browser
        run: |
          mkdir -p data/probe-pp /tmp/pw && cd /tmp/pw
          npm init -y -s >/dev/null && npm i -s playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > get.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'), out = process.env.GITHUB_WORKSPACE + '/data/probe-pp/';
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ locale: 'en-CA', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36' });
            const p = await ctx.newPage();
            for (const slug of ['small-pizza','medium-pizza','large-pizza','x-large-pizza','xxl-pizza','walk-in-slice','stuffed-crust-pizza','alternative-crusts','gourmet-thins']) {
              const r = await p.goto(`https://www.pizzapizza.ca/about-us/nutrition/${slug}/`, { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log('goto', e.message));
              await p.waitForTimeout(2500);
              const page = await p.content();
              const head = await p.evaluate(() => { const t = document.body.innerText; const i = t.search(/SERVING SIZE/i); return t.slice(Math.max(0, i - 60), i + 200); });
              const table = page.slice(page.indexOf('<table'), page.indexOf('</table>') + 8);
              fs.writeFileSync(out + slug + '.html', '<!-- ' + head.replace(/--/g, '-') + ' -->\n' + table);
              console.log(slug, r && r.status(), table.length);
            }
            await b.close();
          })();
          JS
          node get.js
          ls -la "$GITHUB_WORKSPACE/data/probe-pp"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe-pp && git commit -m "Fetch: Pizza Pizza nutrition" || echo nothing
          git pull --rebase -q origin main && git push origin HEAD:main
